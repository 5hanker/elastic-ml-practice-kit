name: Inject anomaly

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Live anomaly scenario"
        type: choice
        required: true
        default: cascade
        options:
          - cascade
          - info-flood
          - delayed

permissions:
  contents: read

concurrency:
  group: mlws-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELASTIC_KIBANA_URL: ${{ secrets.ELASTIC_KIBANA_URL }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secrets
        run: |
          if [ -z "$ELASTIC_KIBANA_URL" ] || [ -z "$ELASTIC_API_KEY" ]; then
            echo "::error::Missing secrets ELASTIC_KIBANA_URL and/or ELASTIC_API_KEY."
            exit 1
          fi
      - name: Inject
        run: python setup.py inject "${{ inputs.scenario }}"

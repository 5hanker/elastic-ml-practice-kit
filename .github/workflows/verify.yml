name: Verify workshop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlws-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELASTIC_KIBANA_URL: ${{ secrets.ELASTIC_KIBANA_URL }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secrets
        run: |
          missing=""
          [ -n "$ELASTIC_KIBANA_URL" ] || missing="$missing ELASTIC_KIBANA_URL"
          [ -n "$ELASTIC_API_KEY" ] || missing="$missing ELASTIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Verify
        run: python setup.py verify --allow-pending
      - name: Links
        if: always()
        run: python setup.py links
      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: ignore
